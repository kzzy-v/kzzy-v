name: Refresh profile activity
on:
  workflow_dispatch:
  schedule:
    - cron: '23 9 * * *'
permissions:
  contents: write
concurrency:
  group: profile-activity
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Render public contribution calendar
        env:
          PROFILE_USER: ${{ github.repository_owner }}
        run: node scripts/update-activity.mjs
      - name: Save updated artwork
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/activity.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh public contribution artwork'
          git push
